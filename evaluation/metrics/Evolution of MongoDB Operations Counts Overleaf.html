<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution of MongoDB Operations Counts in Overleaf</title>

  <script src="https://cdn.plot.ly/plotly-3.5.1.min.js"></script>
</head>

<body>
<div id="chart"></div>

<script>
  const dates = ['August 5th, 2021', 'February 7th, 2022', 'August 5th, 2022', 'February 6th, 2023', 'August 8th, 2023', 'February 5th, 2024', 'August 5th, 2024', 'February 5th, 2025', 'August 5th, 2025', 'February 5th, 2026']

  const operationColors = {
    CREATE: '#2ecc71',
    READ: '#29b6f6',
    UPDATE: '#ffa726',
    DELETE: '#ef5350',
    OTHER: '#616161'
  }

  const technologyPatterns = {
    ExpressJS: '/',
    MongoDB: 'x',
    Redis: '+'
  }

  function createTrace(technology, operation, values) {
    return {
      x: dates,
      y: values,

      name: `${technology} - ${operation}`,

      type: 'bar',

      offsetgroup: technology,
      legendgroup: technology,

      marker: {
        color: operationColors[operation],

        pattern: {
          shape: technologyPatterns[technology],
          fgcolor: 'rgba(255,255,255,0.9)',
          bgcolor: operationColors[operation],
          size: 5,
          solidity: 0.25
        },

        line: {
          color: '#fff',
          width: 1
        }
      }
    }
  }

  const data = [

    /*
      MongoDB
    */
    createTrace('MongoDB', 'OTHER', [10, 10, 10, 12, 12, 5, 5, 5, 4, 3]),
    createTrace('MongoDB', 'CREATE', [23, 23, 23, 32, 34, 35, 41, 64, 76, 69]),
    createTrace('MongoDB', 'READ', [214, 239, 258, 319, 309, 289, 329, 385, 495, 555]),
    createTrace('MongoDB', 'UPDATE', [92, 103, 124, 151, 153, 160, 176, 202, 207, 209]),
    createTrace('MongoDB', 'DELETE', [30, 31, 33, 48, 56, 56, 58, 61, 65, 65])
  ]

  const layout = {

    width: 500,
    height: 500,
    margin: {
      b: 150
    },

    title: 'Evolution of MongoDB Operations Counts in Overleaf',

    barmode: 'stack',

    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff',

    xaxis: {
      title: { text: '' },
      gridcolor: '#e0e0e0'
    },

    yaxis: {
      title: { text: '# Operations' },
      gridcolor: '#e0e0e0'
    },

    legend: {
      orientation: 'v'
    },

    showlegend: true,

    font: {
      family: 'Arial, sans-serif',
      size: 14,
      color: '#212121'
    }
  }

  Plotly.newPlot('chart', data, layout)
</script>
</body>
</html>
