<html>

  var layout = {

    width: 500,
    height: 500,
    margin: {
      b: 150
    },

    showlegend: true,

    xaxis: {
      title: {
        text: ''
      }
    },

      title: {

  Plotly.newPlot('chart', data, layout)

</body>
</html>
