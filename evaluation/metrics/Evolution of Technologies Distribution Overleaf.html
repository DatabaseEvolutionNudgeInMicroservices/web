<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution of Technologies Distribution in Overleaf</title>

  <script src="https://cdn.plot.ly/plotly-3.5.1.min.js"></script>
</head>

<body>
<div id="chart"></div>

<script>
  const dates = ['August 5th, 2021', 'February 7th, 2022', 'August 5th, 2022', 'February 6th, 2023', 'August 8th, 2023', 'February 5th, 2024', 'August 5th, 2024', 'February 5th, 2025', 'August 5th, 2025', 'February 5th, 2026']

  const technologyColors = {
    ExpressJS: '#ebd81c',
    MongoDB: '#0fa54d',
    Redis: '#f74236'
  }

  function createTrace(group, technology, values) {
    return {
      x: dates,
      y: values,

      name: `${technology}`,

      type: 'bar',

      offsetgroup: group,
      legendgroup: technology,

      marker: {
        color: technologyColors[technology],
        line: {
          color: '#fff',
          width: 1
        }
      }
    }
  }

  const data = [

    /*
      ExpressJS
    */
    createTrace('', 'ExpressJS', [57.6, 55.6, 57.0, 55.9, 54.8, 54.3, 52.7, 52.0, 48.7, 47.8]),

    /*
      MongoDB
    */
    createTrace('', 'MongoDB', [26.4, 27.5, 28.1, 29.4, 28.9, 28.2, 30.3, 32.3, 34.1, 34.8]),

    /*
      Redis
    */
    createTrace('', 'Redis', [16.0, 16.9, 15.0, 14.7, 16.2, 17.5, 17.0, 15.7, 17.2, 17.5])
  ]

  const layout = {

    width: 500,
    height: 500,
    margin: {
      b: 150
    },

    title: 'Evolution of Technologies Distribution in Overleaf',

    barmode: 'stack',

    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff',

    xaxis: {
      title: { text: '' },
      gridcolor: '#e0e0e0'
    },

    yaxis: {
      title: { text: '% Code fragments' },
      gridcolor: '#e0e0e0'
    },

    legend: {
      orientation: 'v'
    },

    showlegend: true,

    font: {
      family: 'Arial, sans-serif',
      size: 14,
      color: '#212121'
    }
  }

  Plotly.newPlot('chart', data, layout)
</script>
</body>
</html>
