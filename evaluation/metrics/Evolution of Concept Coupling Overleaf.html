		  font-weight: bold;

	  '#ff829b', // doc
	  '#00a5ef', // message
	  '#ff4d3e', // doc history
	  '#ffc53b', // history
	  '#000000' // version
	]

	const colorMap = {}

	nodeIds.forEach((id, index) => {
	  colorMap[id] = palette[index % palette.length]
	})

  /* Layout */

  function generateCircularLayout(ids) {
    const result = {}
    const radius = 1
    const angleStep = (2 * Math.PI) / ids.length
    ids.forEach((id, i) => {
      const angle = i * angleStep
      result[id] = {
        x: radius * Math.cos(angle),
        y: radius * Math.sin(angle)
      }
    })
    return result
  }

  /* Chart */

  const charts = document.getElementById('charts')

  graphSequence.forEach((graph, index) => {

    graph.nodes = graph.nodes.map(node => ({
      ...node,
      x: fixedLayout[node.id].x,
      y: fixedLayout[node.id].y,
      color: colorMap[node.id]
    }))

    const wrapper = document.createElement('div')
    wrapper.className = 'graph-container'

    const date = document.createElement('div')
    date.className = 'graph-date'
    date.innerText = graph.date

    const plot = document.createElement('div')
    plot.className = 'plot'
    plot.id = `plot-${index}`

    wrapper.appendChild(date)
    wrapper.appendChild(plot)
    charts.appendChild(wrapper)

    renderGraph(plot.id, graph)
  })

  function renderGraph(plotId, graph) {

    const nodeMap = Object.fromEntries(
      graph.nodes.map(n => [n.id, n])
    )

    const edgeTraces = graph.edges.map(edge => {
      const s = nodeMap[edge.source]
      const t = nodeMap[edge.target]
      return {
        type: 'scatter',
        mode: 'lines',
        x: [s.x, t.x],
        y: [s.y, t.y],
        line: {
          width: edge.weight,
          color: '#888'
        },
        hoverinfo: 'none',
        showlegend: false
      }
    })

    const nodeTrace = {
      type: 'scatter',
      mode: 'markers+text',
      x: graph.nodes.map(n => n.x),
      y: graph.nodes.map(n => n.y),
      text: graph.nodes.map(n => n.id),
      textposition: graph.nodes.map(n => n.textposition),
      marker: {
        size: graph.nodes.map(n => n.size),
        color: graph.nodes.map(
          n => n.color
        ),
        opacity: 1,
      },
      hoverinfo: 'none',
      showlegend: false
    }

    const layout = {
      xaxis: {
        visible: false,
        range: [-1.5, 1.5]
      },
      yaxis: {
        visible: false,
        scaleanchor: 'x',
        scaleratio: 1,
        range: [-1.5, 1.5]
      },
      hovermode: 'closest',
      paper_bgcolor: 'transparent',
      plot_bgcolor: 'transparent',
      margin: {
        l: 0,
        r: 0,
        t: 0,
        b: 0
      }
    }

    Plotly.newPlot(
      plotId,
      [...edgeTraces, nodeTrace],
      layout,
      {
        responsive: true
      }
    )
  }
