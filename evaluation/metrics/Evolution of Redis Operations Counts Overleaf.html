<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution of Redis Operations Counts in Overleaf</title>

  <script src="https://cdn.plot.ly/plotly-3.5.1.min.js"></script>
</head>

<body>
<div id="chart"></div>

<script>
  const dates = ['August 5th, 2021', 'February 7th, 2022', 'August 5th, 2022', 'February 6th, 2023', 'August 8th, 2023', 'February 5th, 2024', 'August 5th, 2024', 'February 5th, 2025', 'August 5th, 2025', 'February 5th, 2026']

  const operationColors = {
    CREATE: '#2ecc71',
    READ: '#29b6f6',
    UPDATE: '#ffa726',
    DELETE: '#ef5350',
    OTHER: '#616161'
  }

  const technologyPatterns = {
    ExpressJS: '/',
    MongoDB: 'x',
    Redis: '+'
  }

  function createTrace(technology, operation, values) {
    return {
      x: dates,
      y: values,

      name: `${technology} - ${operation}`,

      type: 'bar',

      offsetgroup: technology,
      legendgroup: technology,

      marker: {
        color: operationColors[operation],

        pattern: {
          shape: technologyPatterns[technology],
          fgcolor: 'rgba(255,255,255,0.9)',
          bgcolor: operationColors[operation],
          size: 5,
          solidity: 0.25
        },

        line: {
          color: '#fff',
          width: 1
        }
      }
    }
  }

  const data = [

    /*
      Redis
    */
    createTrace('Redis', 'OTHER', [51, 51, 49, 57, 57, 54, 64, 64, 68, 69]),
    createTrace('Redis', 'CREATE', [9, 9, 9, 10, 9, 8, 8, 8, 16, 16]),
    createTrace('Redis', 'READ', [92, 110, 90, 106, 109, 105, 113, 113, 139, 145]),
    createTrace('Redis', 'UPDATE', [47, 51, 60, 68, 100, 130, 112, 118, 155, 176]),
    createTrace('Redis', 'DELETE', [25, 29, 31, 41, 41, 40, 46, 46, 50, 47])
  ]

  const layout = {

    width: 500,
    height: 500,
    margin: {
      b: 150
    },

    title: 'Evolution of Redis Operations Counts in Overleaf',

    barmode: 'stack',

    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff',

    xaxis: {
      title: { text: '' },
      gridcolor: '#e0e0e0'
    },

    yaxis: {
      title: { text: '# Operations' },
      gridcolor: '#e0e0e0'
    },

    legend: {
      orientation: 'v'
    },

    showlegend: true,

    font: {
      family: 'Arial, sans-serif',
      size: 14,
      color: '#212121'
    }
  }

  Plotly.newPlot('chart', data, layout)
</script>
</body>
</html>
