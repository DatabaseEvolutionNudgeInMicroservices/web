<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution of MongoDB Operations Distribution in Overleaf</title>

  <script src="https://cdn.plot.ly/plotly-3.5.1.min.js"></script>
</head>

<body>
<div id="chart"></div>

<script>
  const dates = ['August 5th, 2021', 'February 7th, 2022', 'August 5th, 2022', 'February 6th, 2023', 'August 8th, 2023', 'February 5th, 2024', 'August 5th, 2024', 'February 5th, 2025', 'August 5th, 2025', 'February 5th, 2026']

  const operationColors = {
    CREATE: '#2ecc71',
    READ: '#29b6f6',
    UPDATE: '#ffa726',
    DELETE: '#ef5350',
    OTHER: '#616161'
  }

  const technologyPatterns = {
    ExpressJS: '/',
    MongoDB: 'x',
    Redis: '+'
  }

  function createTrace(technology, operation, values) {
    return {
      x: dates,
      y: values,

      name: `${technology} - ${operation}`,

      type: 'bar',

      offsetgroup: technology,
      legendgroup: technology,

      marker: {
        color: operationColors[operation],

        pattern: {
          shape: technologyPatterns[technology],
          fgcolor: 'rgba(255,255,255,0.9)',
          bgcolor: operationColors[operation],
          size: 5,
          solidity: 0.25
        },

        line: {
          color: '#fff',
          width: 1
        }
      }
    }
  }

  const data = [

    /*
      MongoDB
    */
    createTrace('MongoDB', 'OTHER', [2.7, 2.5, 2.2, 2.1, 2.1, 0.9, 0.8, 0.7, 0.5, 0.3]),
    createTrace('MongoDB', 'CREATE', [6.2, 5.7, 5.1, 5.7, 6, 6.4, 6.7, 8.9, 9, 7.7]),
    createTrace('MongoDB', 'READ', [58, 58.9, 57.6, 56.8, 54.8, 53.0, 54.0, 53.7, 58.4, 61.6]),
    createTrace('MongoDB', 'UPDATE', [24.9, 25.4, 27.7, 26.9, 27.1, 29.4, 28.9, 28.2, 24.4, 23.2]),
    createTrace('MongoDB', 'DELETE', [8.1, 7.6, 7.4, 8.5, 9.9, 10.3, 9.5, 8.5, 7.7, 7.2])

  ]

  const layout = {

    width: 500,
    height: 500,
    margin: {
      b: 150
    },

    title: 'Evolution of MongoDB Operations Distribution in Overleaf',

    barmode: 'stack',

    plot_bgcolor: '#ffffff',
    paper_bgcolor: '#ffffff',

    xaxis: {
      title: { text: '' },
      gridcolor: '#e0e0e0'
    },

    yaxis: {
      title: { text: '% Operations' },
      gridcolor: '#e0e0e0'
    },

    legend: {
      orientation: 'v'
    },

    showlegend: true,

    font: {
      family: 'Arial, sans-serif',
      size: 14,
      color: '#212121'
    }
  }

  Plotly.newPlot('chart', data, layout)
</script>
</body>
</html>
